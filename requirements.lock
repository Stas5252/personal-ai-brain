# requirements.txt carries compatibility RANGES; this file carries exact pins so
# a rebuild is reproducible and a bad upstream release cannot silently break
# production. Install with:
#
#     pip install -r requirements.lock
#
# To refresh after an intentional upgrade, install requirements.txt in a clean
# virtualenv, verify the app starts, then regenerate:
#
#     pip freeze --exclude-editable > requirements.lock
#
