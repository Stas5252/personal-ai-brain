name: Apply audit hardening once
on:
  push:
    branches: [fix/post-merge-production-audit]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          guided = Path("src/brain/channels/telegram_guided_runner.py")
          text = guided.read_text(encoding="utf-8")
          text = text.replace(
              "from src.brain.channels.runtime_state import owner_allowed",
              "from src.brain.channels.runtime_state import owner_allowed, process_request",
              1,
          )
          old = "result=self.brain.process_chat(query=query,conversation_history=self._history(),images=[image] if image else None)"
          new = "result=process_request(self.brain,query,legacy.UPLOADS,images=[image] if image else None,conversation_history=self._history())"
          if old not in text:
              raise SystemExit("guided vision anchor missing")
          guided.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = Path("src/brain/api/app.py")
          text = app.read_text(encoding="utf-8")
          old = "        storage = UPLOAD_ROOT.is_dir()\n        return JSONResponse({'status': 'ready' if storage else 'degraded', 'database': True,\n                             'storage': storage, 'model_key_configured': bool(GEMINI_API_KEY),\n                             'model_live_check': 'not_run'}, status_code=200 if storage else 503)"
          new = "        storage = UPLOAD_ROOT.is_dir()\n        model_configured = bool(GEMINI_API_KEY)\n        service_ready = storage and model_configured\n        return JSONResponse({'status': 'ready' if service_ready else 'degraded', 'database': True,\n                             'storage': storage, 'model_key_configured': model_configured,\n                             'model_live_check': 'not_run'}, status_code=200 if service_ready else 503)"
          if old not in text:
              raise SystemExit("readiness anchor missing")
          app.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Add regression tests
        run: |
          cat > tests/reliability/test_production_honesty.py <<'PY'
          """Production honesty checks for vision and readiness boundaries."""
          import json
          from contextlib import nullcontext
          from types import SimpleNamespace
          from unittest.mock import Mock, patch

          from src.brain.channels.telegram_guided_runner import GuidedBot


          def test_guided_freeform_stops_when_live_vision_fails(tmp_path):
              image = tmp_path / "frame.jpg"
              image.write_bytes(b"fixture")
              bot = object.__new__(GuidedBot)
              bot.brain = Mock()
              bot.brain.shooting_engine.critique_shot.return_value = {"status": "ERROR"}
              bot._collect = lambda message, temp: ("Разбери кадр", str(image))
              bot._history = lambda: []
              bot.media = SimpleNamespace(typing=lambda *args, **kwargs: nullcontext())
              with patch("src.brain.channels.telegram_guided_runner.legacy.UPLOADS", tmp_path):
                  answer = bot._freeform({}, None)
              assert "анализ изображения недоступен" in answer.lower()
              bot.brain.process_chat.assert_not_called()


          def test_readiness_is_degraded_without_live_model_key():
              from src.brain.api import app as app_module
              with patch.object(app_module, "GEMINI_API_KEY", ""):
                  response = app_module.ready()
              assert response.status_code == 503
              payload = json.loads(response.body)
              assert payload["status"] == "degraded"
              assert payload["model_key_configured"] is False
          PY
      - name: Commit hardening
        run: |
          rm .github/workflows/apply-audit-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/brain/channels/telegram_guided_runner.py src/brain/api/app.py tests/reliability/test_production_honesty.py .github/workflows/apply-audit-hardening.yml
          git commit -m 'Harden live vision and readiness honesty'
          git push
