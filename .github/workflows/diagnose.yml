name: Diagnose acceptance
on:
  push:
    branches: ['feature/**', 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - src/brain/api/app.py
          - src/brain/api/routes/image_routes.py
          - src/brain/channels/bot_config.py
          - src/brain/channels/task_queue.py
          - src/brain/channels/telegram_adapter.py
          - src/brain/channels/telegram_guided_runner.py
          - src/brain/channels/telegram_media.py
          - src/brain/channels/telegram_ratelimit.py
          - src/brain/config.py
          - src/brain/engines/context_engine.py
          - src/brain/engines/image_engine.py
          - src/brain/engines/memory_engine.py
          - src/brain/engines/memory_hygiene.py
          - src/brain/engines/outreach_policy.py
          - src/brain/engines/proactive_engine.py
          - src/brain/engines/profile_engine.py
          - src/brain/engines/promotion_engine.py
          - src/brain/engines/reference_vault.py
          - src/brain/engines/style_engine.py
          - src/brain/engines/visual_identity.py
          - src/brain/services/guided_actions.py
          - src/brain/services/reference_intake.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile file
        run: python -m py_compile '${{ matrix.target }}'
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check src scripts tests --select E9,F63,F7,F82 --output-format github
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - tests/reliability/test_honest_ingestion.py
          - tests/reliability/test_regressions.py
          - tests/reliability/test_startup_validation.py
          - tests/reliability/test_vetted_knowledge.py
          - tests/reliability/test_video_content_honesty.py
          - tests/brain/test_corpus_pipeline.py
          - tests/brain/test_pricing_and_matching.py
          - tests/brain/test_yaishka_deep_capabilities.py
          - tests/brain/test_photographer_acceptance.py
          - tests/brain/test_product_scenarios_50.py
          - tests/brain/test_full_yaishka_parity.py
          - tests/brain/test_guided_actions.py
          - tests/brain/test_image_generation.py
          - tests/brain/test_reply_safety.py
          - tests/brain/test_style_learning.py
          - tests/brain/test_telegram_reliability.py
          - tests/brain/test_voice_loop.py
          - tests/brain/test_outreach_policy.py
          - tests/brain/test_memory_hygiene.py
          - tests/brain/test_visual_identity.py
          - tests/brain/test_reference_vault.py
          - tests/brain/test_reference_intake.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q '${{ matrix.target }}' -k 'not live_vision_critique'
