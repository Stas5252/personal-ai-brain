# Temporary: the acceptance job reports one red dot for eighteen suites, and
# the job log is not reachable from every review surface. Running one suite per
# job makes the failing file readable from the check names alone. Delete this
# file once the acceptance job is green again.
name: Diagnose acceptance

on:
  push:
    branches: ['feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt ruff
          pip check
      - name: Compile every module
        run: python -m compileall -q src scripts tests
      - name: Lint for correctness only
        run: ruff check src scripts tests --select E9,F63,F7,F82 --output-format github

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - tests/reliability
          - tests/brain/test_corpus_pipeline.py
          - tests/brain/test_pricing_and_matching.py
          - tests/brain/test_yaishka_deep_capabilities.py
          - tests/brain/test_photographer_acceptance.py
          - tests/brain/test_product_scenarios_50.py
          - tests/brain/test_full_yaishka_parity.py
          - tests/brain/test_guided_actions.py
          - tests/brain/test_image_generation.py
          - tests/brain/test_reply_safety.py
          - tests/brain/test_style_learning.py
          - tests/brain/test_telegram_reliability.py
          - tests/brain/test_voice_loop.py
          - tests/brain/test_outreach_policy.py
          - tests/brain/test_memory_hygiene.py
          - tests/brain/test_visual_identity.py
          - tests/brain/test_reference_vault.py
          - tests/brain/test_reference_intake.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run one suite
        run: pytest -q '${{ matrix.target }}' -k 'not live_vision_critique'
