name: Repair legacy files once
on:
  push:
    branches: [feature/image-generation-and-live-fixes]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last complete Telegram runner
        run: git show 14e4d51084adab6d7472e535b89e9a80e0c67954:src/brain/channels/telegram_runner.py > src/brain/channels/telegram_runner.py
      - name: Update reliability test to current corpus API
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/reliability/test_vetted_knowledge.py')
          text = path.read_text(encoding='utf-8')
          old = 'from scripts.seed_vetted_knowledge import KNOWLEDGE_DIR, VETTED_FILES, validate_corpus'
          new = 'from scripts.seed_vetted_knowledge import KNOWLEDGE_DIR, CORE_FILES as VETTED_FILES, core_paths as validate_corpus'
          if old not in text:
              raise SystemExit('expected stale import not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove one-time workflow and push repair
        run: |
          rm .github/workflows/repair-legacy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/brain/channels/telegram_runner.py tests/reliability/test_vetted_knowledge.py .github/workflows/repair-legacy.yml
          git commit -m 'Fix truncated Telegram runner and corpus compatibility'
          git push
