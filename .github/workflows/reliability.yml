name: Production acceptance

on:
  push:
    branches: [master, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash enables -e and pipefail on GitHub-hosted runners.
    shell: bash

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRAIN_API_KEY: ci-only-random-brain-api-key-000000000000000000
      GEMINI_API_KEY: ci-gemini-placeholder
      TELEGRAM_BOT_TOKEN: 123456789:ci-telegram-placeholder-token
      TELEGRAM_OWNER_ID: '123456789'
      WEBUI_SECRET_KEY: ci-only-random-webui-secret-000000000000000000
      BRAIN_INGEST_CORPUS: 'false'
      EMBEDDING_PROVIDER_TYPE: hash_fallback
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
          pip check
      - name: Compile and lint correctness
        run: |
          set -Eeuo pipefail
          python -m compileall -q src scripts tests
          ruff check src scripts tests --select E9,F63,F7,F82 --output-format github
      - name: Validate production configuration and Compose
        run: |
          set -Eeuo pipefail
          python scripts/validate_environment.py api
          python scripts/validate_environment.py telegram
          python scripts/validate_environment.py worker
          docker compose config --quiet
      - name: Course corpus is discoverable and ingestible
        run: |
          set -Eeuo pipefail
          python scripts/ingest_course_corpus.py --dry-run
      - name: Complete deterministic offline suite
        run: |
          set -Eeuo pipefail
          pytest -q -m 'not live' tests \
            --strict-markers \
            --junitxml=acceptance-results.xml 2>&1 | tee acceptance-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          retention-days: 14
          path: |
            acceptance-results.xml
            acceptance-log.txt
      - name: Build production services
        run: |
          set -Eeuo pipefail
          docker compose build brain_api knowledge_worker telegram
      - name: Compose startup smoke
        run: |
          set -Eeuo pipefail
          docker compose up -d --no-build brain_api knowledge_worker
          for attempt in $(seq 1 90); do
            status="$(docker inspect --format='{{.State.Health.Status}}' brain-api 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              break
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs --no-color brain_api knowledge_worker
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' brain-api)" = healthy
          test "$(docker inspect --format='{{.State.Running}}' brain-knowledge-worker)" = true
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${BRAIN_API_KEY}" \
            http://127.0.0.1:8000/health/ready
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/health/ready)"
          test "$code" = 401
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${BRAIN_API_KEY}" \
            http://127.0.0.1:8000/v1/models
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Compose cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans || true
