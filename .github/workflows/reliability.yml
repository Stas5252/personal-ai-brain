name: Reliability regression
on:
  push:
    branches: [master, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src
      - name: Deterministic regression suite (no real API calls)
        run: python -m pytest tests/reliability -v --junitxml=reliability-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-results
          path: reliability-results.xml
