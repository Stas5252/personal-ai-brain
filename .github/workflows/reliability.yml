name: Production acceptance

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRAIN_API_KEY: ci-only-random-brain-api-key-000000000000000000
      GEMINI_API_KEY: ci-gemini-placeholder
      TELEGRAM_BOT_TOKEN: 123456789:ci-telegram-placeholder-token
      TELEGRAM_OWNER_ID: '123456789'
      WEBUI_SECRET_KEY: ci-only-random-webui-secret-000000000000000000
      BRAIN_INGEST_CORPUS: 'false'
      EMBEDDING_PROVIDER_TYPE: hash_fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install system dependencies
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics.log) 2>&1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgomp1 libsndfile1
      - name: Install Python dependencies
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics.log) 2>&1
          pip install --no-deps -r requirements.lock
          pip check
      - name: Compile and lint correctness
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics.log) 2>&1
          python -m compileall -q src scripts tests
          ruff check src scripts tests --select E9,F63,F7,F82 --output-format github
      - name: Validate production configuration and Compose
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics.log) 2>&1
          python scripts/validate_environment.py api
          python scripts/validate_environment.py telegram
          python scripts/validate_environment.py worker
          docker compose config --quiet
      - name: Course corpus is discoverable and ingestible
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics.log) 2>&1
          python scripts/ingest_course_corpus.py --dry-run
      - name: Complete deterministic offline suite
        run: |
          set -Eeuo pipefail
          pytest -q -m 'not live' tests \
            --strict-markers \
            --junitxml=acceptance-results.xml 2>&1 | tee -a acceptance-log.txt ci-diagnostics.log
      - name: Build production services
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics.log) 2>&1
          docker compose build brain_api knowledge_worker telegram
      - name: Compose startup smoke
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics.log) 2>&1
          docker compose up -d --no-build brain_api knowledge_worker
          for attempt in $(seq 1 90); do
            status="$(docker inspect --format='{{.State.Health.Status}}' brain-api 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then break; fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs --no-color brain_api knowledge_worker
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' brain-api)" = healthy
          test "$(docker inspect --format='{{.State.Running}}' brain-knowledge-worker)" = true
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error -H "Authorization: Bearer ${BRAIN_API_KEY}" http://127.0.0.1:8000/health/ready
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/health/ready)"
          test "$code" = 401
          curl --fail --silent --show-error -H "Authorization: Bearer ${BRAIN_API_KEY}" http://127.0.0.1:8000/v1/models
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color 2>&1 | tee -a ci-diagnostics.log || true
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-results
          retention-days: 14
          path: |
            acceptance-results.xml
            acceptance-log.txt
            ci-diagnostics.log
      - name: Compose cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  report-failure:
    needs: deterministic-acceptance
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download diagnostics produced by the read-only acceptance job
        uses: actions/download-artifact@v4
        with:
          name: acceptance-results
      - name: Publish isolated failure diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- isolated-production-ci-diagnostics -->';
            let log = 'No diagnostic log was produced.';
            if (fs.existsSync('ci-diagnostics.log')) {
              log = fs.readFileSync('ci-diagnostics.log', 'utf8').slice(-50000);
            }
            const body = `${marker}\n## Production acceptance failed\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `<details><summary>Last diagnostic output</summary>\n\n\`\`\`text\n${log}\n\`\`\`\n</details>`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
